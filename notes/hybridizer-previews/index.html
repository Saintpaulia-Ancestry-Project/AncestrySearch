<script>
/* ---------------------------------------------------------------- sample data (invented seedlings; official parent names are only examples) */
const OFFICIAL = {
  sticky: { name: "Rob's Sticky Wicket", hyb: "R. Robinson", size: "Standard", hue: 285, desc: "Double dark purple, ruffled. Variegated foliage." },
  babypink: { name: "Baby Pink", hyb: "(sample)", size: "Miniature", hue: 335, desc: "Single pink. Girl foliage." },
  boysen: { name: "Buckeye Boysenberry", hyb: "(sample)", size: "Standard", hue: 305, desc: "Semidouble boysenberry. Medium green foliage." },
  chiffon: { name: "Chiffon Blush", hyb: "(sample)", size: "Standard", hue: 350, desc: "Pink fringed. Wavy foliage." },
  ionanthus: { name: "S. 5c1. variety ionanthus", hyb: "Species", size: "Species", hue: 255, desc: "Single blue-violet. Wild species." },
};
const DESCS = ["Single dark blue, plain leaf", "Double pink, wavy edge", "Semidouble lavender, girl foliage", "Single white, blue edge", "Double purple, ruffled", "Fringed pink, quilted leaf", "Single pale blue, variegated leaf", "Semidouble magenta, wavy leaf"];
const ST = ["growing", "flowering", "keeping", "culled", "released"];
const ICON = { growing: "◔", flowering: "✿", keeping: "★", culled: "✕", released: "⚑" };
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
function mk(cross, n, dist, extra) {

function wireCombos(onPick) {

      let items = D.crosses.filter((c) => !c.deleted && w.every((x) => (c.id + " " + parentText(c.seed) + " " + parentText(c.pollen) + " " + c.made.slice(0, 4)).toLowerCase().includes(x)));

     <label>Pollen parent (father) <input type="search" placeholder="Type a name" value="${edit ? esc(parentText(edit.pollen)) : ""}"></label></fieldset>
   <fieldset><legend>Dates</legend>

}
/* spreadsheet */
const COLS = [["cross", "Cross"], ["photo", "Photo"], ["label", "#"], ["status", "Status"], ["desc", "Description"], ["flower", "Flower"], ["double", "Form"], ["added", "Added"], ["notes", "Notes"], ["promoted", "Promoted name"]];
let SH = { group: true, family: false, hidden: new Set(["double"]), undo: [], root: "GG-25-003" };
function familyRows(rootId) {
  const out = []; const walk = (cid, gen) => { for (const s of seedsOf(cid)) { out.push({ s, gen }); D.crosses.filter((c) => c.seed && c.seed.t === "l" && c.seed.id === s.sid || c.pollen && c.pollen.t === "l" && c.pollen.id === s.sid).forEach((c2) => walk(c2.id, gen + 1)); } }; walk(rootId, 1); return out;
}
function viewSheet(q) {
  if (q.get("family") === "1") SH.family = true;
  const f = q.get("status") || "", cr = q.get("cross") || "";
  let rows = SH.family ? familyRows(SH.root) : D.seedlings.map((s) => ({ s, gen: 0 }));
  if (f) rows = rows.filter((r) => r.s.status === f); if (cr) rows = rows.filter((r) => r.s.cross === cr);
  const cols = COLS.filter((c) => !SH.hidden.has(c[0]));
  const cell = (r, c) => {
    const s = r.s, k = c[0];
    if (k === "status") return `<td><select data-k="status" data-id="${s.sid}">${ST.map((x) => `<option${x === s.status ? " selected" : ""}>${x}</option>`).join("")}</select></td>`;
    if (k === "added") return `<td><input type="date" data-k="added" data-id="${s.sid}" value="${s.added}"></td>`;
    if (k === "cross") return `<td><span>${SH.family ? `<span class="gen-ind">${"↳ ".repeat(r.gen - 1)}</span>` : ""}<a href="#/cross/${s.cross}">${s.cross}</a></span></td>`;
    if (k === "photo") return s.photos ? `<td class="thumb"><a href="#/seedling/${s.sid}" aria-label="Open seedling ${s.sid}"><span class="ph" style="--h:${s.hue};--s:var(--th)" role="img" aria-label="Sample photo"></span><span class="badge">${s.photos}</span></a></td>` : `<td class="thumb"><a href="#" onclick="flash('Camera opens to add a photo to ${s.sid}');return false" aria-label="Add photo to ${s.sid}"><span class="nophoto" style="--s:var(--th)">+</span></a></td>`;
    if (k === "label") return `<td><span><a href="#/seedling/${s.sid}">${s.label}</a></span></td>`;
    return `<td><div contenteditable="plaintext-only" data-k="${k}" data-id="${s.sid}" spellcheck="false">${esc(s[k])}</div></td>`;
  };
  let body = "", last = "";
  rows.sort((a, b) => SH.family ? 0 : a.s.cross.localeCompare(b.s.cross) || a.s.label - b.s.label);
  for (const r of rows) {
    if (SH.group && !SH.family && r.s.cross !== last) { last = r.s.cross; const c = cById(last); body += `<tr class="group"><td colspan="${cols.length + (SH.family ? 1 : 0)}">${last}: ${esc(parentText(c.seed))} × ${esc(parentText(c.pollen))}</td></tr>`; }
    body += `<tr>${SH.family ? `<td><span>${r.gen}</span></td>` : ""}${cols.map((c) => cell(r, c)).join("")}</tr>`;
  }
  return `<h1>Spreadsheet</h1><p class="muted small">One row per seedling, with a thumbnail of its first photo (“+” = no photo yet; tap to add one). Thumbnails load as you scroll, and only the visible rows are drawn, so thousands of rows stay fast. Click a cell to edit; Tab and Enter move between cells; paste from Excel works. Edited cells show a green mark. Every edit is saved on this device straight away.</p>
  <div class="toolbar"><span class="seg"><button class="${SH.family ? "" : "on"}" id="m-all">All seedlings</button><button class="${SH.family ? "on" : ""}" id="m-fam">Family of one cross</button></span>
   ${SH.family ? `<label>Cross ${crossPicker("root", SH.root)}</label>` : `<label><input type="checkbox" id="grp"${SH.group ? " checked" : ""}> Group by cross</label>`}
   <label>Status <select id="fs"><option value="">Any</option>${ST.map((x) => `<option${x === f ? " selected" : ""}>${x}</option>`).join("")}</select></label>
   <span class="menu" id="cm"><button class="secondary" type="button" id="cmb">Columns ▾</button><span class="pop">${COLS.map((c) => `<label><input type="checkbox" data-col="${c[0]}"${SH.hidden.has(c[0]) ? "" : " checked"}> ${c[1]}</label>`).join("")}</span></span>
   <button class="secondary" type="button" id="addrow">+ Row</button><button class="secondary" type="button" id="undo">Undo (${SH.undo.length})</button><button class="secondary" type="button" onclick="flash('Downloads a .csv file')">Export CSV</button><span class="muted small">${rows.length} rows</span></div>
  ${SH.family ? `<p class="note">Family view: the seedlings of ${SH.root} (generation 1) and the seedlings of every later cross that used one of them as a parent (generation 2, 3, …).</p>` : ""}
  <div class="sheet-wrap"><table class="sheet"><thead><tr>${SH.family ? "<th>Gen</th>" : ""}${cols.map((c) => `<th>${c[1]}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function wireSheet() {
  const app = document.getElementById("app");
  const save = (el, val) => { const s = sById(el.dataset.id), k = el.dataset.k; if (s[k] === val) return; SH.undo.push([s, k, s[k]]); s[k] = val; el.closest("td").classList.add("edited"); document.getElementById("undo").textContent = `Undo (${SH.undo.length})`; flash("Saved on this device"); };
  app.querySelectorAll("[contenteditable]").forEach((el) => { el.addEventListener("blur", () => save(el, el.textContent.trim())); el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); const rows = [...el.closest("table").querySelectorAll(`[data-k="${el.dataset.k}"]`)]; const n = rows[rows.indexOf(el) + 1]; el.blur(); if (n) n.focus(); } }); });
  app.querySelectorAll("select[data-k],input[data-k]").forEach((el) => el.addEventListener("change", () => save(el, el.value)));
  const on = (id, fn) => { const e = document.getElementById(id); if (e) e.addEventListener("click", fn); };
  on("m-all", () => { SH.family = false; render(); }); on("m-fam", () => { SH.family = true; render(); });
  const g = document.getElementById("grp"); if (g) g.onchange = () => { SH.group = g.checked; render(); };
  const rt = document.getElementById("root"); if (rt && rt.tagName === "SELECT") rt.onchange = () => { SH.root = rt.value; render(); };
  wireCombos((n, id) => { SH.root = id; render(); });
  document.getElementById("fs").onchange = (e) => { location.hash = "#/sheet" + (e.target.value ? "?status=" + e.target.value : ""); };
  on("cmb", () => document.getElementById("cm").classList.toggle("open"));
  app.querySelectorAll("[data-col]").forEach((c) => c.onchange = () => { c.checked ? SH.hidden.delete(c.dataset.col) : SH.hidden.add(c.dataset.col); render(); document.getElementById("cm").classList.add("open"); });
  on("undo", () => { const u = SH.undo.pop(); if (u) { u[0][u[1]] = u[2]; render(); flash("Edit undone"); } });
  on("addrow", () => flash("A new seedling row is added at the end of the selected cross"));
}
function viewSync() {
  return `<h1>Sync & backup</h1><p class="muted">Your data stays on this device. To use it on another device, make a file here and open it there. The file is also your backup.</p>
  <div class="note warn">Last backup: <b>12 days ago</b>. Browsers can clear stored data (for example on iPhones after weeks without use), so save a backup file regularly.</div>
  <div class="grid cols" style="margin-top:12px"><div class="panel"><h2 style="margin-top:0">Make a file</h2>
   <form class="f"><fieldset><legend>What to include</legend>
    <label><span><input type="radio" name="w" checked> Changes since the last sync with</span> <select><option>Pixel phone</option><option>Home PC</option></select></label>
    <label><span><input type="radio" name="w"> Everything (full backup)</span></label></fieldset>
   <fieldset><legend>Photos</legend><label><span><input type="radio" name="p" checked> Thumbnails (small, recommended)</span></label><label><span><input type="radio" name="p"> All photos (large file)</span></label><label><span><input type="radio" name="p"> No photos (data only)</span></label>
    <small class="muted">Estimated size now: thumbnails 8 MB, all photos 190 MB, data only 0.3 MB.</small></fieldset>
   <fieldset><legend>Protection</legend><label><span><input type="checkbox" id="enc"> Protect the file with a passphrase</span><small>Optional. The file is encrypted on this device, so it is safe to keep in a cloud folder. If you forget the passphrase the file cannot be opened by anyone, including us.</small></label>
    <input type="password" placeholder="Passphrase (needed again to open the file)" aria-label="Passphrase" id="pass" disabled></fieldset>
   <fieldset><legend>Save the file</legend>
    <div class="row"><button type="button" id="b-pick" onclick="flash('System save dialog opens: choose Drive, Dropbox, OneDrive or any folder')">Save… (Drive, Dropbox, any folder)</button>
     <button type="button" class="secondary" id="b-share" onclick="flash('Share sheet opens (only offered where the device accepts a zip file)')">Share…</button>
     <button type="button" class="secondary" onclick="flash('Downloads my-hybridizer-2026-11-17.zip')">Download</button></div>
    <small class="muted">The app never contacts Google, Dropbox or any other site itself. <b>Save…</b> opens your device's own save dialog (tested on Android: it can reach Drive and other apps). <b>Share…</b> is shown only on devices that accept a zip file in their share sheet: Android Chrome does not (tested), so it is hidden there. <b>Download</b> works everywhere; then use your Files app to move the file. Before sending a file to an online service, consider turning on the passphrase above.</small>
    <div class="warn" id="share-warn" hidden>This file will leave your device. Without a passphrase anyone with access to that online account or link can read your crosses and photos.</div></fieldset></form></div>
  <div class="panel"><h2 style="margin-top:0">Open a file from another device</h2><p><button type="button" id="pick">Choose file…</button></p>
   <p class="small muted">On a phone the file chooser also reaches Google Drive, Dropbox, OneDrive, iCloud and your downloads. On Android, once the app is installed, you can also use <b>Share → Saintpaulia Hybridizer</b> from the Files app or an email. Files are not fetched from web addresses: that would let the app contact other sites, and we want it to be unable to.</p><div id="dry" class="small muted">The app first checks the file and shows what would change. Nothing changes until you confirm.</div></div></div>
  <h2>This device</h2><div class="panel"><dl class="facts"><dt>Device name</dt><dd>Home PC</dd><dt>Persistent storage</dt><dd>Granted</dd><dt>Last syncs</dt><dd>Pixel phone, 12 days ago (imported 9 new, 14 updated)</dd></dl></div>`;
}
function viewSettings() {
  return `<h1>Settings</h1><div class="grid cols">
  <div class="panel"><h2 style="margin-top:0">Appearance</h2><p class="small muted">Use the yellow preview bar for the live pickers in this preview. The finished app has these in Settings: <b>Mode</b> (Match device, Light, Dark, High contrast light, High contrast dark) and, separately, <b>Color scheme</b> (Violet, Blue, Green, Red, Brown, Grey; each has a light and a dark version that change backgrounds, panels, text and accent colors), plus text size and density.</p></div>
  <div class="panel"><h2 style="margin-top:0">Saintpaulia Ancestry data on this device</h2><form class="f">
   <label><span><input type="radio" name="a" checked> <b>Online only</b></span><small>Nothing downloaded. Parents show the names and basics saved with your crosses. Ancestry graphs and the official photos need internet.</small></label>
   <label><span><input type="radio" name="a"> <b>Data downloaded</b> (about 38 MB)</span><small>Search and ancestry work offline. You choose when to update.</small></label>
   <label><span><input type="radio" name="a"> <b>Data and images</b> (about 38 MB + photos, size to be measured)</span><small>Adds the photos hosted by Saintpaulia Ancestry: all of them, or only parents you mark. Photos only linked from other sites cannot be downloaded.</small></label></form></div>
  <div class="panel"><h2 style="margin-top:0">About you</h2><form class="f"><label>Hybridizer initials (used in cross codes) <input value="GG" style="width:6em"></label><label>Device name <input value="Home PC"></label></form></div>
  <div class="panel"><h2 style="margin-top:0">Trash</h2><form class="f"><label>Keep deleted items for <select><option>7 days</option><option selected>30 days</option><option>90 days</option><option>Never erase automatically</option></select></label></form></div></div>`;
}
function viewTrash() {
  return `<h1>Trash</h1><p class="muted">Deleted items can be restored until they are erased. After that only an empty marker is kept, so the other devices erase them too. Backups and sync files saved earlier still contain the data.</p>
  <div class="grid">${[["Seedling GG-26-014-19 (culled)", "deleted 2 days ago, erased in 28 days"], ["Cross GG-24-006 and its 5 seedlings", "deleted 25 days ago, erased in 5 days"]].map((t) => `<div class="panel row"><span><b>${t[0]}</b><br><span class="small muted">${t[1]}</span></span><span style="margin-left:auto" class="row"><button class="secondary" onclick="flash('Restored')">Restore</button><button class="danger" onclick="confirm('Erase permanently? This cannot be undone.') && flash('Erased')">Erase now…</button></span></div>`).join("")}</div>
  <p style="margin-top:14px"><button class="danger" onclick="confirm('Erase everything in the Trash permanently?') && flash('Trash emptied')">Empty Trash…</button></p>`;

/* ---------------------------------------------------------------- router and preview controls */
function render() {
  const raw = location.hash.replace(/^#/, "") || "/home"; const [path, qs = ""] = raw.split("?"); const parts = path.split("/").filter(Boolean); const q = new URLSearchParams(qs);
  const v = parts[0] || "home"; const app = document.getElementById("app");
  const map = { home: viewHome, crosses: () => viewCrosses(q), cross: () => viewCross(decodeURIComponent(parts[1] || ""), q), seedling: () => viewSeedling(decodeURIComponent(parts[1] || "")), new: () => viewNew(q), sheet: () => viewSheet(q), sync: viewSync, settings: viewSettings, trash: viewTrash };
  app.innerHTML = (map[v] || viewHome)();
  document.getElementById("nav").innerHTML = NAV.map(([k, t]) => `<a href="#/${k}" class="${k === v || (v === "cross" || v === "seedling") && k === "crosses" ? "on" : ""}">${t}</a>`).join("");
  if (v === "sheet") wireSheet();
  if (v === "sheet" && q.get("open") === "1") { const r = document.getElementById("root"); if (r && r.tagName === "INPUT") r.focus(); }

  const enc = document.getElementById("enc"); if (enc) enc.onchange = () => { document.getElementById("pass").disabled = !enc.checked; };
  const pick = document.getElementById("pick"); if (pick) pick.onclick = () => { document.getElementById("dry").innerHTML = `<div class="panel" style="color:var(--text)"><b>Check of “my-hybridizer-2026-11-05.zip” (from Pixel phone)</b><br><span class="small muted">(If the file is protected, a passphrase box appears first.)</span><br>9 new &middot; 14 updated &middot; 212 unchanged &middot; 2 conflicts &middot; 31 photos to add<ul class="small"><li>Seedling GG-26-014-07, <b>notes</b>: edited on both devices. Newer edit (phone, Nov 4) will be kept; yours is saved in its history.</li><li>Seedling GG-25-021-03 and a seedling with the same number were added on both devices: <b>both kept</b>; please renumber one.</li></ul><button type="button" onclick="flash('Imported (sample)')">Import</button> <button class="secondary" type="button">Cancel</button></div>`; };
}
const pv = (id) => document.getElementById(id);
const mq = matchMedia("(prefers-color-scheme: dark)");
function applyLook() {
  const r = document.documentElement, m = pv("pv-mode").value;
  r.setAttribute("data-mode", m || (mq.matches ? "dark" : "light"));
  r.setAttribute("data-scheme", pv("pv-scheme").value || "violet");
  pv("pv-size").value ? r.setAttribute("data-size", pv("pv-size").value) : r.removeAttribute("data-size");
  pv("pv-density").value ? r.setAttribute("data-density", pv("pv-density").value) : r.removeAttribute("data-density");
  try { localStorage.setItem("hyb-preview3", JSON.stringify(["pv-mode", "pv-scheme", "pv-size", "pv-density"].map((i) => pv(i).value))); } catch (e) { /* ignore */ }
}
mq.addEventListener("change", () => { if (!pv("pv-mode").value) applyLook(); });
try { (JSON.parse(localStorage.getItem("hyb-preview3")) || []).forEach((val, i) => { pv(["pv-mode", "pv-scheme", "pv-size", "pv-density"][i]).value = val; }); } catch (e) { /* ignore */ }
["pv-mode", "pv-scheme", "pv-size", "pv-density"].forEach((i) => pv(i).addEventListener("change", applyLook));
pv("pv-phone").onclick = () => { const on = pv("stage").classList.toggle("phone"); pv("pv-phone").textContent = "Phone width: " + (on ? "on" : "off"); };
pv("pv-reset-edit").onclick = () => { D = SAMPLE(); D.seedlings.forEach((s) => { s.sid = s.cross + "-" + String(s.label).padStart(2, "0"); }); SH.undo = []; render(); flash("Sample data reset"); };
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
addEventListener("online", () => pv("onl").textContent = "Online"); addEventListener("offline", () => pv("onl").textContent = "Offline");
{ const u = new URLSearchParams(location.search); if (u.has("mode")) pv("pv-mode").value = u.get("mode"); if (u.has("scheme")) pv("pv-scheme").value = u.get("scheme"); if (u.get("density")) pv("pv-density").value = u.get("density"); if (u.get("phone")) pv("pv-phone").click(); }
applyLook(); render();
